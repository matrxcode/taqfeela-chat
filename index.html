<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تقفيلة | شبكة المسوقين المشفرة</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#090a0f">
    <meta name="mobile-web-app-capable" content="yes">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --bg-body: #090a0f;
            --bg-card: #12141c;
            --bg-input: #0a0b10;
            --border: #1e2230;
            --border-focus: #3b82f6;
            --primary: #2563eb;
            --accent: #10b981;
            --gold: #f59e0b;
            --danger: #ef4444;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --text-dark: #6b7280;
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --font-main: 'Readex Pro', sans-serif;
        }

        /* ANTI-COPY & ANTI-LEAK SECURITY */
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: var(--font-main); 
            -webkit-tap-highlight-color: transparent; 
            user-select: none; 
            -webkit-user-select: none; 
        }

        input, textarea, button { user-select: text; -webkit-user-select: text; }

        body { background-color: var(--bg-body); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }

        .screen { display: none; width: 100%; }
        .screen.active { display: block; }

        .auth-container { max-width: 400px; margin: 0 auto; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 32px 24px; }
        .brand-header { text-align: center; margin-bottom: 24px; }
        .brand-logo { display: inline-flex; align-items: center; justify-content: center; width: 48px; height: 48px; background: rgba(37,99,235,.1); border: 1px solid rgba(37,99,235,.3); border-radius: var(--radius-md); color: var(--primary); font-weight: 700; font-size: 20px; margin-bottom: 12px; }
        .brand-title { font-size: 20px; font-weight: 600; }
        .brand-sub { font-size: 13px; color: var(--text-muted); margin-top: 4px; }

        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 12px; font-weight: 500; color: var(--text-muted); margin-bottom: 6px; }
        .form-control { width: 100%; background: var(--bg-input); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px 14px; color: var(--text-main); font-size: 14px; outline: none; }
        .form-control:focus { border-color: var(--border-focus); }

        .btn { width: 100%; padding: 12px; background: var(--primary); color: #fff; border: none; border-radius: var(--radius-sm); font-size: 14px; font-weight: 500; cursor: pointer; }
        .btn-success { background: var(--accent); }
        .version-tag { text-align: center; margin-top: 20px; font-size: 11px; color: var(--text-dark); cursor: pointer; }

        .app-layout { max-width: 1000px; width: 100%; margin: 0 auto; display: grid; grid-template-columns: 280px 1fr; gap: 20px; }
        @media(max-width: 850px) { .app-layout { grid-template-columns: 1fr; } }

        .sidebar-card, .main-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 20px; }
        .profile-box { padding-bottom: 16px; border-bottom: 1px solid var(--border); margin-bottom: 16px; }
        .profile-name { font-weight: 600; font-size: 16px; }
        .profile-badge { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 12px; background: rgba(255,255,255,.05); color: var(--text-muted); margin-top: 4px; border: 1px solid var(--border); }

        .balance-box { background: var(--bg-input); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 16px; margin-bottom: 16px; }
        .balance-label { font-size: 12px; color: var(--text-muted); }
        .balance-val { font-size: 24px; font-weight: 700; color: var(--accent); margin-top: 4px; }

        /* PINNED MESSAGE BANNER */
        .pinned-banner { display: none; background: rgba(245,158,11,.1); border: 1px solid rgba(245,158,11,.3); padding: 10px 14px; border-radius: var(--radius-md); margin-bottom: 12px; font-size: 12px; color: var(--gold); }
        .pinned-banner.active { display: flex; justify-content: space-between; align-items: center; }

        .chat-tabs { display: flex; gap: 8px; margin-bottom: 12px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
        .tab-btn { padding: 8px 14px; background: transparent; border: none; color: var(--text-muted); cursor: pointer; font-size: 13px; font-weight: 500; border-radius: var(--radius-sm); }
        .tab-btn.active { background: rgba(37,99,235,.15); color: var(--primary); font-weight: 600; }

        .chat-container { display: flex; flex-direction: column; height: 480px; }
        .chat-messages { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 12px; }

        .msg { max-width: 85%; background: var(--bg-input); border: 1px solid var(--border); padding: 10px 12px; border-radius: var(--radius-md); font-size: 13px; position: relative; }
        .msg.me { align-self: flex-start; background: rgba(37,99,235,.1); border-color: rgba(37,99,235,.3); }

        .msg-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .msg-sender { font-weight: 600; color: var(--primary); font-size: 12px; cursor: pointer; text-decoration: underline; }
        .msg-time { font-size: 10px; color: var(--text-dark); margin-right: 6px; }

        .msg-menu-btn { cursor: pointer; font-weight: bold; padding: 2px 6px; font-size: 14px; color: var(--text-muted); border-radius: 4px; }
        .msg-dropdown { display: none; position: absolute; top: 28px; left: 10px; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-sm); box-shadow: 0 4px 12px rgba(0,0,0,.5); z-index: 10; width: 160px; overflow: hidden; }
        .msg-dropdown.show { display: block; }
        .dropdown-item { padding: 8px 12px; font-size: 11px; color: var(--text-main); cursor: pointer; display: flex; align-items: center; gap: 6px; }
        .dropdown-item:hover { background: rgba(37,99,235,.2); }

        .video-container { margin-top: 8px; border-radius: var(--radius-sm); overflow: hidden; border: 1px solid var(--border); background: #000; }
        .video-container iframe { width: 100%; height: 200px; border: none; display: block; }

        .btn-sm { padding: 6px 12px; font-size: 12px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--bg-input); color: var(--text-main); cursor: pointer; }
        .flex-between { display: flex; justify-content: space-between; align-items: center; }
        .logout-link { font-size: 12px; color: var(--danger); cursor: pointer; }

        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.7); align-items: center; justify-content: center; z-index: 100; }
        .modal.active { display: flex; }
        .modal-content { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 20px; width: 90%; max-width: 380px; }
        .modal-header { font-size: 14px; font-weight: 600; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
        .seen-list { max-height: 200px; overflow-y: auto; font-size: 12px; }
        .seen-item { padding: 6px 0; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; color: var(--text-muted); }
    </style>
</head>
<body oncontextmenu="return false;">

    <!-- AUTH SCREEN -->
    <div id="authScreen" class="screen active">
        <div class="auth-container">
            <div class="brand-header">
                <div class="brand-logo">🔒</div>
                <div class="brand-title">منصة تقفيلة للمسوقين</div>
                <div class="brand-sub">سجّل دخولك لمتابعة العمولات والشات</div>
            </div>
            <form onsubmit="loginMarketer(event)">
                <div class="form-group">
                    <label>الاسم الثنائي</label>
                    <input type="text" id="mName" class="form-control" placeholder="أحمد محمود" required>
                </div>
                <div class="form-group">
                    <label>الكود التعريفي</label>
                    <input type="text" id="mCode" class="form-control" placeholder="M-8401" style="text-transform:uppercase" required>
                </div>
                <button type="submit" class="btn">دخول اللوحة</button>
            </form>
            <div class="version-tag" onclick="handleSecretAdminClick()">إصدار النظام v3.0.0</div>
        </div>
    </div>

    <!-- MARKETER DASHBOARD -->
    <div id="marketerScreen" class="screen">
        <div class="app-layout">
            <div class="sidebar-card">
                <div class="profile-box">
                    <div class="flex-between">
                        <div class="profile-name" id="dispName">--</div>
                        <span class="logout-link" onclick="logout()">خروج</span>
                    </div>
                    <div id="dispBadge" class="profile-badge">مسوق</div>
                </div>
                
                <div class="balance-box">
                    <div class="balance-label">الرصيد الحالي</div>
                    <div class="balance-val" id="dispBalance">0 ج.م</div>
                    <button class="btn btn-success" style="margin-top:10px; font-size:12px; padding:8px;" onclick="openWithdrawModal()">💸 طلب سحب الرصيد</button>
                </div>

                <div class="form-group">
                    <label>الكنية (اسم الشهرة/اللقب)</label>
                    <input type="text" id="mNickInput" class="form-control" placeholder="مثال: أبو شهاب" style="font-size: 12px;">
                    <button class="btn-sm" style="width:100%; margin-top:6px;" onclick="updateNickname()">حفظ الكنية</button>
                </div>
            </div>

            <div class="main-card">
                <!-- PINNED MESSAGE DISPLAY -->
                <div id="pinnedBanner" class="pinned-banner">
                    <div>📌 <b id="pinnedText">--</b></div>
                    <span id="unpinBtn" style="cursor:pointer; font-size:11px;" onclick="unpinMessage()">إلغاء التثبيت</span>
                </div>

                <div class="chat-tabs">
                    <button class="tab-btn active" id="tabPublic" onclick="switchChatTab('public')">🌐 الشات العام</button>
                    <button class="tab-btn" id="tabPrivate" onclick="switchChatTab('private')">💬 شات خاص <span id="dmTargetLabel"></span></button>
                </div>

                <div id="publicChatView" class="chat-container">
                    <div class="chat-messages" id="chatMsgs"></div>
                    <form style="display:flex; gap:8px;" onsubmit="sendPublicChat(event)">
                        <input type="text" id="msgText" class="form-control" placeholder="اكتب رسالتك أو ضِع رابط فيديو..." required>
                        <button type="submit" class="btn" style="width: 80px;">إرسال</button>
                    </form>
                </div>

                <div id="privateChatView" class="chat-container" style="display:none;">
                    <div class="chat-messages" id="dmMsgs"></div>
                    <form style="display:flex; gap:8px;" onsubmit="sendPrivateChat(event)">
                        <input type="text" id="dmMsgText" class="form-control" placeholder="رسالة خاصة..." required>
                        <button type="submit" class="btn" style="width: 80px;">إرسال</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL POPUP FOR MESSAGE INFO -->
    <div id="infoModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <span>معلومات الرسالة (من شاهدها)</span>
                <span style="cursor:pointer;" onclick="closeModal('infoModal')">✕</span>
            </div>
            <div id="seenList" class="seen-list"></div>
        </div>
    </div>

    <!-- MODAL FOR WITHDRAWAL REQUEST -->
    <div id="withdrawModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <span>طلب سحب الرصيد</span>
                <span style="cursor:pointer;" onclick="closeModal('withdrawModal')">✕</span>
            </div>
            <form onsubmit="submitWithdraw(event)">
                <div class="form-group">
                    <label>طريقة السحب</label>
                    <select id="wMethod" class="form-control">
                        <option value="فودافون كاش">فودافون كاش</option>
                        <option value="انستا باي">إنستا باي (InstaPay)</option>
                        <option value="حساب بنكي">حساب بنكي</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>رقم المحفظة / العنوان</label>
                    <input type="text" id="wDetails" class="form-control" placeholder="010xxxxxxx أو IPA" required>
                </div>
                <div class="form-group">
                    <label>المبلغ المطلوب</label>
                    <input type="number" id="wAmount" class="form-control" placeholder="أدخل المبلغ" required>
                </div>
                <button type="submit" class="btn btn-success">إرسال الطلب</button>
            </form>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyACL2nG7OdUuU4HRippr7P46OJpPpDYf5g",
            authDomain: "squadly-bb782.firebaseapp.com",
            projectId: "squadly-bb782",
            storageBucket: "squadly-bb782.firebasestorage.app",
            messagingSenderId: "605956538187",
            appId: "1:605956538187:web:bac92b0e4f087be0e232ce"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let currentUser = null;
        let activeDmTarget = null;

        const encData = (str) => btoa(encodeURIComponent(str));
        const decData = (str) => { try { return decodeURIComponent(atob(str)); } catch(e) { return str; } };

        function formatTime(timestamp) {
            if (!timestamp) return '';
            const date = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
            return date.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
        }

        function containsPhoneNumber(text) {
            if (currentUser && currentUser.isLeader) return false;
            const cleanText = text.replace(/[\s\-\.\_\,\/\\()\+]/g, '');
            const egPhoneRegex = /(010|011|012|015)[0-9]{8}/;
            const generalPhoneRegex = /[0-9]{10,11}/;
            return egPhoneRegex.test(cleanText) || generalPhoneRegex.test(cleanText);
        }

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function loginMarketer(e) {
            e.preventDefault();
            const name = document.getElementById('mName').value.trim();
            const code = document.getElementById('mCode').value.trim().toUpperCase();

            db.collection('marketers').where('code', '==', code).get().then((snapshot) => {
                if (snapshot.empty) return alert('الكود التعريفي غير صحيح');
                let userFound = null;
                snapshot.forEach(docSnap => {
                    if (docSnap.data().name === name) userFound = { id: docSnap.id, ...docSnap.data() };
                });

                if (!userFound) return alert('الاسم غير مطابق للكود المسجل');
                currentUser = userFound;
                initMarketerView();
            });
        }

        function logout() { currentUser = null; showScreen('authScreen'); }

        function initMarketerView() {
            showScreen('marketerScreen');
            document.getElementById('dispName').textContent = currentUser.nickname ? `${currentUser.name} (${currentUser.nickname})` : currentUser.name;
            document.getElementById('dispBadge').textContent = currentUser.isLeader ? 'ليدر الفريق' : 'مسوق';
            if (currentUser.nickname) document.getElementById('mNickInput').value = currentUser.nickname;

            db.collection('marketers').doc(currentUser.id).onSnapshot((docSnap) => {
                if (docSnap.exists) document.getElementById('dispBalance').textContent = `${docSnap.data().balance || 0} ج.م`;
            });

            listenPinnedMessage();
            loadPublicChat();
        }

        function updateNickname() {
            const nick = document.getElementById('mNickInput').value.trim();
            db.collection('marketers').doc(currentUser.id).update({ nickname: nick }).then(() => {
                currentUser.nickname = nick;
                document.getElementById('dispName').textContent = nick ? `${currentUser.name} (${nick})` : currentUser.name;
                alert("تم حفظ الكنية بنجاح!");
            });
        }

        // --- PINNED MESSAGE ENGINE ---
        function listenPinnedMessage() {
            db.collection('settings').doc('pinned').onSnapshot(docSnap => {
                const banner = document.getElementById('pinnedBanner');
                if (docSnap.exists && docSnap.data().text) {
                    document.getElementById('pinnedText').textContent = docSnap.data().text;
                    banner.classList.add('active');
                    document.getElementById('unpinBtn').style.display = (currentUser && currentUser.isLeader) ? 'inline' : 'none';
                } else {
                    banner.classList.remove('active');
                }
            });
        }

        async function pinMessage(text) {
            if (!currentUser.isLeader) return alert("ميزة التثبيت مخصصة لليدر فقط");
            await db.collection('settings').doc('pinned').set({ text: text });
            alert("تم تثبيت الرسالة بنجاح!");
        }

        async function unpinMessage() {
            await db.collection('settings').doc('pinned').delete();
        }

        function parseMediaAndText(text) {
            const screenAppRegex = /(https?:\/\/screenapp\.io\/app\/v\/[a-zA-Z0-9]+)/g;
            const youtubeRegex = /(https?:\/\/(?:www\.)?youtube\.com\/watch\?v=([a-zA-Z0-9_-]+)|https?:\/\/youtu\.be\/([a-zA-Z0-9_-]+))/g;

            let html = text;
            let videoEmbed = '';

            if (screenAppRegex.test(text)) {
                const match = text.match(screenAppRegex)[0];
                const videoId = match.split('/v/')[1];
                videoEmbed = `<div class="video-container"><iframe src="https://screenapp.io/app/v/${videoId}" allowfullscreen></iframe></div>`;
            } else if (youtubeRegex.test(text)) {
                const match = text.match(youtubeRegex)[0];
                let ytId = match.includes('v=') ? match.split('v=')[1].split('&')[0] : match.split('/').pop();
                videoEmbed = `<div class="video-container"><iframe src="https://www.youtube.com/embed/${ytId}" allowfullscreen></iframe></div>`;
            }

            return { textHtml: html, videoEmbed };
        }

        // --- PUBLIC CHAT ---
        function loadPublicChat() {
            db.collection('chat').orderBy('timestamp', 'asc').limit(50).onSnapshot((snapshot) => {
                const chatContainer = document.getElementById('chatMsgs');
                chatContainer.innerHTML = '';
                
                snapshot.forEach(msgDoc => {
                    const msgId = msgDoc.id;
                    const data = msgDoc.data();
                    const isMe = currentUser && currentUser.id === data.senderId;
                    const rawText = decData(data.textEncrypted || '');
                    const { textHtml, videoEmbed } = parseMediaAndText(rawText);
                    const timeStr = formatTime(data.timestamp);

                    const displayName = data.senderNickname ? `${data.senderName} (${data.senderNickname})` : data.senderName;

                    const msgDiv = document.createElement('div');
                    msgDiv.className = `msg ${isMe ? 'me' : ''}`;
                    
                    msgDiv.innerHTML = `
                        <div class="msg-header">
                            <div>
                                <span class="msg-sender" onclick="startPrivateChat('${data.senderId}', '${displayName}')">${displayName} 💬</span>
                                <span class="msg-time">${timeStr}</span>
                            </div>
                            <span class="msg-menu-btn" onclick="toggleMsgMenu(event, '${msgId}')">⋮</span>
                        </div>
                        <div>${textHtml}</div>
                        ${videoEmbed}

                        <div id="menu-${msgId}" class="msg-dropdown">
                            <div class="dropdown-item" onclick="openMsgInfo('${msgId}')">ℹ️ معلومات الرسالة</div>
                            ${currentUser.isLeader ? `<div class="dropdown-item" onclick="pinMessage('${rawText}')">📌 تثبيت الرسالة</div>` : ''}
                        </div>
                    `;
                    chatContainer.appendChild(msgDiv);
                });
                chatContainer.scrollTop = chatContainer.scrollHeight;
            });
        }

        function toggleMsgMenu(e, msgId) {
            e.stopPropagation();
            document.querySelectorAll('.msg-dropdown').forEach(d => d.classList.remove('show'));
            const menu = document.getElementById(`menu-${msgId}`);
            if (menu) menu.classList.toggle('show');
        }

        function startPrivateChat(userId, userName) {
            if (userId === currentUser.id) return;
            activeDmTarget = { id: userId, name: userName };
            document.getElementById('dmTargetLabel').textContent = `(${userName})`;
            switchChatTab('private');
            loadPrivateMessages();
        }

        function switchChatTab(type) {
            document.getElementById('tabPublic').classList.toggle('active', type === 'public');
            document.getElementById('tabPrivate').classList.toggle('active', type === 'private');
            document.getElementById('publicChatView').style.display = type === 'public' ? 'flex' : 'none';
            document.getElementById('privateChatView').style.display = type === 'private' ? 'flex' : 'none';
        }

        function loadPrivateMessages() {
            if (!activeDmTarget) return;
            const chatKey = [currentUser.id, activeDmTarget.id].sort().join('_');

            db.collection('private_chats').doc(chatKey).collection('messages')
                .orderBy('timestamp', 'asc').onSnapshot((snapshot) => {
                    const dmContainer = document.getElementById('dmMsgs');
                    dmContainer.innerHTML = '';
                    snapshot.forEach(msgDoc => {
                        const data = msgDoc.data();
                        const isMe = currentUser.id === data.senderId;
                        const rawText = decData(data.textEncrypted);
                        const { textHtml, videoEmbed } = parseMediaAndText(rawText);

                        const div = document.createElement('div');
                        div.className = `msg ${isMe ? 'me' : ''}`;
                        div.innerHTML = `<div>${textHtml}</div>${videoEmbed}`;
                        dmContainer.appendChild(div);
                    });
                    dmContainer.scrollTop = dmContainer.scrollHeight;
                });
        }

        async function sendPrivateChat(e) {
            e.preventDefault();
            const input = document.getElementById('dmMsgText');
            const text = input.value.trim();
            if (!text || !activeDmTarget) return;

            if (containsPhoneNumber(text)) {
                return alert("⚠️ يمنع إرسال أرقام الهواتف حفاظاً على خصوصية الشبكة.");
            }

            const chatKey = [currentUser.id, activeDmTarget.id].sort().join('_');
            await db.collection('private_chats').doc(chatKey).collection('messages').add({
                senderId: currentUser.id,
                textEncrypted: encData(text),
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });
            input.value = '';
        }

        async function sendPublicChat(e) {
            e.preventDefault();
            const textInput = document.getElementById('msgText');
            const text = textInput.value.trim();
            if (!text) return;

            if (containsPhoneNumber(text)) {
                return alert("⚠️ يمنع إرسال أرقام الهواتف في الشات العام.");
            }

            await db.collection('chat').add({
                senderId: currentUser.id,
                senderName: currentUser.name,
                senderNickname: currentUser.nickname || '',
                textEncrypted: encData(text),
                seenBy: [currentUser.name],
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });
            textInput.value = '';
        }

        // --- WITHDRAWAL SYSTEM ---
        function openWithdrawModal() {
            document.getElementById('withdrawModal').classList.add('active');
        }

        async function submitWithdraw(e) {
            e.preventDefault();
            const method = document.getElementById('wMethod').value;
            const details = document.getElementById('wDetails').value.trim();
            const amount = parseFloat(document.getElementById('wAmount').value);

            await db.collection('withdrawals').add({
                marketerId: currentUser.id,
                marketerName: currentUser.name,
                method, details, amount,
                status: 'قيد الانتظار',
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });

            alert("تم إرسال طلب السحب بنجاح إلى الإدارة!");
            closeModal('withdrawModal');
        }

        function openMsgInfo(msgId) {
            db.collection('chat').doc(msgId).get().then(docSnap => {
                if (!docSnap.exists) return;
                const seenList = docSnap.data().seenBy || [];
                const container = document.getElementById('seenList');
                container.innerHTML = '';
                seenList.forEach(name => {
                    const div = document.createElement('div');
                    div.className = 'seen-item';
                    div.innerHTML = `<span>👤 ${name}</span><span style="color:var(--accent);">تم الاطلاع</span>`;
                    container.appendChild(div);
                });
                document.getElementById('infoModal').classList.add('active');
            });
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('active');
        }
    </script>
</body>
</html>
